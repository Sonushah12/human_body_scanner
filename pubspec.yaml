name: anatomorph
description: An offline anatomy study atlas with interactive exploration and local learning progress.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  cupertino_icons: ^1.0.8
  hive_ce: ^2.21.0
  hive_ce_flutter: ^2.4.0
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  model_viewer_plus: ^1.10.0
  url_launcher: ^6.3.3
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/svg/
    - assets/models/
    - assets/img/
    - assets/licenses/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati.ttf
